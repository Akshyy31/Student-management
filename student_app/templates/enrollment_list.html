{% extends "base.html" %}
{% block content %}
<h2>All Enrollments</h2>
<table cellpadding="5">
  <tr>
    <th>Student</th>
    <th>Course</th>
    <th>Date Enrolled</th>
  </tr>
  {% for e in enrollments %}
  <tr>
    <td>{{ e.student.first_name }} {{ e.student.last_name }}</td>
    <td>{{ e.course.name }}</td>
    <td>{{ e.date_enrolled }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
