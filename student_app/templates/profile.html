{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow-lg p-4 rounded-3">
        <h3 class="mb-3">Student Profile</h3>
        <p><strong>Name:</strong> {{ profile.user.get_full_name }}</p>
        <p><strong>Roll Number:</strong> {{ profile.roll_number }}</p>
        <p><strong>Department:</strong> {{ profile.department.name }}</p>
        <p><strong>Year of Admission:</strong> {{ profile.year_of_admission }}</p>
    </div>
</div>
{% endblock %}
